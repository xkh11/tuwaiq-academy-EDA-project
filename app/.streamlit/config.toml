[theme]
base = "light"
primaryColor = "#FF5A5F"
backgroundColor = "#F7F7F7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#222222"
font = "DM Sans:https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap"
baseRadius = "10px"
buttonRadius = "full"
borderColor = "#DDDDDD"
showWidgetBorder = true
showSidebarBorder = true
dataframeHeaderBackgroundColor = "#FFFFFF"
linkColor = "#C8303D"
linkUnderline = false

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FFFFFF"
borderColor = "#DDDDDD"

[browser]
gatherUsageStats = false
